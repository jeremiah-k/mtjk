name: CI
on:
  push:
    branches:
      - develop
  pull_request:
    # This fork develops on `develop`; stacked PRs may target any temporary
    # work branch. Run the same validation for every non-master PR base so a
    # new branch prefix cannot silently skip CI.
    branches-ignore:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CI_ASSERT_MODULE_STATE_DRIFT: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      POETRY_INSTALL_ARGS: --all-extras --with dev,powermon
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - &checkout_step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup_python_step
        name: Install Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - &cache_poetry_step
        name: Cache Poetry artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-${{ env.PYTHON_VERSION }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.PYTHON_VERSION }}-poetry-
            ${{ runner.os }}-poetry-
      - &install_dependencies_step
        name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.4.3"
      - &install_local_step
        name: Install configured CLI from local
        run: |
          poetry install ${{ env.POETRY_INSTALL_ARGS }}
          primary_cli="$(poetry run python -c 'from meshtastic._branding import PRIMARY_CLI_NAME; print(PRIMARY_CLI_NAME)')"
          poetry run "${primary_cli}" --version
      - name: Run tests with pytest
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            poetry run pytest --cov=meshtastic --cov-report=xml --junitxml=junit.xml
          else
            poetry run pytest --cov=meshtastic --junitxml=junit.xml
          fi
      - name: Upload coverage reports to Codecov
        if: ${{ matrix.python-version == '3.13' }}
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jeremiah-k/mtjk
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.13' }}
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jeremiah-k/mtjk
          files: ./junit.xml
          report_type: test_results
          fail_ci_if_error: false
  pylint:
    name: Pylint (py3.13)
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13"
      POETRY_INSTALL_ARGS: --all-extras --with dev,powermon
    steps:
      - *checkout_step
      - *setup_python_step
      - *cache_poetry_step
      - *install_dependencies_step
      - *install_local_step
      - name: Run pylint
        run: poetry run pylint meshtastic examples/
  ruff-tests:
    name: Ruff Tests (py3.13)
    runs-on: ubuntu-latest
    steps:
      - *checkout_step
      - *setup_python_step
      - name: Load Ruff version from Trunk
        run: python bin/check_quality_tool_versions.py --github-env "$GITHUB_ENV"
      - name: Install ruff
        run: python -m pip install --upgrade "ruff==${RUFF_VERSION}"
      - name: Run ruff on tests
        run: ruff check meshtastic/tests tests
  mypy:
    name: Mypy (py3.13)
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13"
      POETRY_INSTALL_ARGS: --all-extras --with dev,powermon
    steps:
      - *checkout_step
      - *setup_python_step
      - *cache_poetry_step
      - *install_dependencies_step
      - *install_local_step
      - name: Check types with mypy
        run: poetry run mypy meshtastic/
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - *checkout_step
      - name: Lint shell scripts
        run: .trunk/trunk check --filter=shellcheck bin/*.sh

  compatibility:
    name: Compatibility Inventory (py3.13)
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.13"
      POETRY_INSTALL_ARGS: --all-extras --with dev,powermon
    steps:
      - *checkout_step
      - *setup_python_step
      - *cache_poetry_step
      - *install_dependencies_step
      - *install_local_step
      - name: Validate compatibility markers inventory
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg -n "COMPAT_STABLE_SHIM|COMPAT_DEPRECATE" meshtastic
          else
            grep -R -nE "COMPAT_STABLE_SHIM|COMPAT_DEPRECATE" meshtastic
          fi
      - name: Run compatibility alias checks
        run: |
          poetry run pytest \
            tests/test_ble_naming_compatibility.py \
            tests/test_ble_runner.py::TestBLECoroutineRunner::test_run_coroutine_threadsafe_timeout_alias_warns_deprecated \
            tests/test_ble_runner.py::TestBLECoroutineRunner::test_run_coroutine_threadsafe_timeout_alias_warns_once \
            meshtastic/tests/test_init.py::test_init_serial_alias_points_to_pyserial_module \
            meshtastic/tests/test_mt_config.py \
            meshtastic/tests/test_util.py::test_dotdict_deprecated_warns \
            meshtastic/tests/test_powermon_power_supply.py::test_deprecated_current_aliases_warn_once_per_method \
            meshtastic/tests/test_slog_power_logger.py::test_root_dir_legacy_alias_warns_once \
            meshtastic/tests/test_slog_power_logger.py::test_store_current_reading_warns_once_when_voltage_unavailable \
            meshtastic/tests/test_mesh_interface_core.py::test_sendPacket_alias_with_destination_as_int \
            meshtastic/tests/test_mesh_interface_core.py::test_sendPacket_alias_with_no_destination \
            meshtastic/tests/test_mesh_interface_send_concurrency.py::test_send_telemetry_supported_and_fallback_paths
  meshtasticd-integration:
    name: meshtasticd Integration (py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_VERSION: "3.13"
      POETRY_INSTALL_ARGS: --all-extras --with dev,powermon
      MESHTASTICD_IMAGE: meshtastic/meshtasticd:2.8.0-alpha-debian@sha256:099b99e965a4ce5d5220572d3f3160ad0a8c541eccf335d941355d6d5cb35465
      MESHTASTICD_HOST: localhost:4401
      MESHTASTICD_PORT: "4401"
      MESHTASTICD_READY_TIMEOUT_SECONDS: "180"
      MESHTASTICD_LOG_ON_SUCCESS: "true"
      MESHTASTICD_LOG_DIR: ${{ github.workspace }}/.meshtasticd-logs/single
    steps:
      - *checkout_step
      - *setup_python_step
      - *cache_poetry_step
      - *install_dependencies_step
      - *install_local_step
      - name: Run meshtasticd integration tests against simulator
        run: ./bin/run-smokevirt-with-meshtasticd.sh
      - name: Summarize meshtasticd integration logs
        if: always()
        run: |
          bash ./bin/summarize-meshtasticd-logs.sh \
            "meshtasticd Integration Summary" \
            "./bin/run-smokevirt-with-meshtasticd.sh" \
            "${MESHTASTICD_LOG_DIR}" >>"${GITHUB_STEP_SUMMARY}"
      - name: Upload meshtasticd integration logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meshtasticd-integration-logs
          path: ${{ env.MESHTASTICD_LOG_DIR }}
          if-no-files-found: warn
  simradio-firmware:
    name: SimRadio Firmware (${{ matrix.channel }}, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.channel != 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        channel:
          - beta
          - alpha
          - daily
    env:
      PYTHON_VERSION: "3.13"
      POETRY_INSTALL_ARGS: --all-extras --with dev,powermon
      MESHTASTICD_SIM_LOG_DIR: ${{ github.workspace }}/.meshtasticd-logs/simradio/${{ matrix.channel }}
      SIMRADIO_RESULT_DIR: ${{ github.workspace }}/.test-results/simradio/${{ matrix.channel }}
      MESHTASTICD_CHANNEL: "${{ matrix.channel }}"
      SIMRADIO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - *checkout_step
      - *setup_python_step
      - *cache_poetry_step
      - *install_dependencies_step
      - *install_local_step
      - name: Install meshtasticd (${{ matrix.channel }}) from PPA
        run: |
          for attempt in 1 2 3; do
            if sudo add-apt-repository -y "ppa:meshtastic/${MESHTASTICD_CHANNEL}" \
              && sudo apt-get update \
              && sudo apt-get install -y meshtasticd; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "meshtasticd PPA installation failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Record installed meshtasticd package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${SIMRADIO_RESULT_DIR}"
          {
            printf 'repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'github_sha=%s\n' "${GITHUB_SHA}"
            printf 'source_sha=%s\n' "${SIMRADIO_SOURCE_SHA}"
            printf 'checkout_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'ref=%s\n' "${GITHUB_REF}"
            printf 'head_ref=%s\n' "${GITHUB_HEAD_REF:-}"
            printf 'base_ref=%s\n' "${GITHUB_BASE_REF:-}"
            printf 'workflow=%s\n' "${GITHUB_WORKFLOW}"
            printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'channel=%s\n' "${MESHTASTICD_CHANNEL}"
          } | tee "${SIMRADIO_RESULT_DIR}/source-context.txt"
          dpkg-query -W -f='${Package}\t${Version}\n' meshtasticd \
            | tee "${SIMRADIO_RESULT_DIR}/firmware-package.txt"
          timeout 5s meshtasticd --version 2>&1 \
            | tee "${SIMRADIO_RESULT_DIR}/firmware-version.txt" || true
      - name: Run process-managed simradio smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${SIMRADIO_RESULT_DIR}"
          poetry run pytest -m simradio -vv --tb=long --durations=20 \
            --junitxml="${SIMRADIO_RESULT_DIR}/junit.xml" 2>&1 \
            | tee "${SIMRADIO_RESULT_DIR}/pytest.log"
      - name: Upload simradio firmware logs and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simradio-${{ matrix.channel }}-logs
          path: |
            ${{ env.MESHTASTICD_SIM_LOG_DIR }}
            ${{ env.SIMRADIO_RESULT_DIR }}
          if-no-files-found: warn
  # Fast install sanity check across Python versions.
  # Full tests run in the tests job above.
  # Lint/type checks run in dedicated jobs for earlier independent failures.
  validate:
    name: Validate install (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      # Validate base package installs without extras.
      POETRY_INSTALL_ARGS: ""
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - *checkout_step
      - *setup_python_step
      - *cache_poetry_step
      - *install_dependencies_step
      - *install_local_step
