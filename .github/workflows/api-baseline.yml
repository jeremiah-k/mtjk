name: API Baseline

on:
  pull_request:
    # Match the main CI workflow: stacked PRs may target any temporary work
    # branch, while master remains the upstream-tracking branch.
    branches-ignore:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  api-baseline-master:
    name: API Baseline vs Upstream Master (py3.14)
    runs-on: ubuntu-latest
    env:
      UV_SYNC_ARGS: --all-extras --group powermon
      UPSTREAM_REPO: meshtastic/python
      UPSTREAM_REF: master
    steps:
      - name: Checkout PR branch (current)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install configured CLI from local
        run: |
          uv sync --locked ${{ env.UV_SYNC_ARGS }}
          primary_cli="$(uv run --locked python -c 'from meshtastic._branding import PRIMARY_CLI_NAME; print(PRIMARY_CLI_NAME)')"
          uv run --locked "${primary_cli}" --version
      - name: Checkout API baseline branch (upstream master)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: base-checkout
      - name: Extract base API surface (upstream master)
        run: uv run --locked python3 bin/extract_api_surface.py base-checkout/meshtastic > base_surface.json
      - name: Extract PR API surface
        run: uv run --locked python3 bin/extract_api_surface.py meshtastic > pr_surface.json
      - name: Compare API surfaces vs upstream master
        run: python3 bin/compare_api_surfaces.py base_surface.json pr_surface.json --base-label "upstream/${{ env.UPSTREAM_REF }}"

  api-baseline-develop:
    name: API Baseline vs Develop (py3.14)
    runs-on: ubuntu-latest
    needs: api-baseline-master
    env:
      UV_SYNC_ARGS: --all-extras --group powermon
      API_BASELINE_REF: develop
    steps:
      - name: Checkout PR branch (current)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install configured CLI from local
        run: |
          uv sync --locked ${{ env.UV_SYNC_ARGS }}
          primary_cli="$(uv run --locked python -c 'from meshtastic._branding import PRIMARY_CLI_NAME; print(PRIMARY_CLI_NAME)')"
          uv run --locked "${primary_cli}" --version
      - name: Checkout API baseline branch (develop)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.API_BASELINE_REF }}
          path: base-checkout
      - name: Extract base API surface (develop)
        run: uv run --locked python3 bin/extract_api_surface.py base-checkout/meshtastic > base_surface.json
      - name: Extract PR API surface
        run: uv run --locked python3 bin/extract_api_surface.py meshtastic > pr_surface.json
      - name: Compare API surfaces vs develop
        run: |
          python3 bin/compare_api_surfaces.py \
            base_surface.json \
            pr_surface.json \
            --base-label "${{ env.API_BASELINE_REF }}"
