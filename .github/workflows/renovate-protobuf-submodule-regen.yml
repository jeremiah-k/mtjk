name: Regenerate protobufs for Renovate submodule updates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - "**-review"
    paths:
      - protobufs

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NANOPB_VERSION: 0.4.9.2
  NANOPB_SHA256: 7e05f5908f0dff5d91cb90d11ca487876de8ec274695887959b3903e4b307887

jobs:
  regenerate-protobufs:
    if: >
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    concurrency:
      group: protobuf-regen-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.5.0"

      - name: Sync submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Restore cached nanopb
        id: nanopb_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nanopb-${{ env.NANOPB_VERSION }}
          key: nanopb-${{ env.NANOPB_VERSION }}-${{ env.NANOPB_SHA256 }}

      - name: Download nanopb
        if: steps.nanopb_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tarball="nanopb-${NANOPB_VERSION}-linux-x86.tar.gz"
          mirrors=(
            "https://github.com/nanopb/nanopb/releases/download/nanopb-${NANOPB_VERSION}/${tarball}"
            "https://jpa.kapsi.fi/nanopb/download/${tarball}"
          )
          downloaded=0
          for url in "${mirrors[@]}"; do
            echo "Trying ${url}"
            rm -f "${tarball}"
            if curl -fsSL --retry 3 --retry-delay 5 -o "${tarball}" "${url}" \
              && echo "${NANOPB_SHA256}  ${tarball}" | sha256sum -c --status -; then
              downloaded=1
              break
            fi
            echo "Mirror failed or checksum mismatch: ${url}" >&2
          done
          if [ "${downloaded}" -ne 1 ]; then
            echo "All nanopb mirrors failed for ${NANOPB_VERSION}" >&2
            exit 1
          fi
          tar xzf "${tarball}"
          mv "nanopb-${NANOPB_VERSION}-linux-x86" "nanopb-${NANOPB_VERSION}"

      - name: Install Python dependencies
        run: poetry install --with dev

      - name: Re-generate protocol buffers
        run: ./bin/regen-protobufs.sh

      - name: Commit generated protobuf changes
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protobufs
          git add meshtastic/protobuf
          if ! git diff --cached --quiet; then
            PROTOBUF_REVISION="$(git -C protobufs rev-parse HEAD)"
            git commit \
              -m "Regenerate Python protobuf bindings" \
              -m "Refresh the committed runtime modules and type stubs from protobufs ${PROTOBUF_REVISION}." \
              -m "The outputs were produced by bin/regen-protobufs.sh so the Python package remains synchronized with the protocol schema selected by Renovate."
            git push origin "HEAD:${PR_HEAD_REF}"
          else
            echo "No changes to commit"
          fi
