name: Regenerate protobufs for Renovate submodule updates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - "**-review"
    paths:
      - protobufs

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NANOPB_VERSION: 0.4.9.2
  NANOPB_SHA256: 7e05f5908f0dff5d91cb90d11ca487876de8ec274695887959b3903e4b307887

jobs:
  regenerate-protobufs:
    if: >
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    concurrency:
      group: protobuf-regen-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.4.3"

      - name: Sync submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Download nanopb
        run: |
          curl -fsSL -o nanopb-${NANOPB_VERSION}-linux-x86.tar.gz https://jpa.kapsi.fi/nanopb/download/nanopb-${NANOPB_VERSION}-linux-x86.tar.gz
          echo "${NANOPB_SHA256}  nanopb-${NANOPB_VERSION}-linux-x86.tar.gz" | sha256sum -c -
          tar xzf nanopb-${NANOPB_VERSION}-linux-x86.tar.gz
          mv nanopb-${NANOPB_VERSION}-linux-x86 nanopb-${NANOPB_VERSION}

      - name: Install Python dependencies
        run: poetry install --with dev

      - name: Re-generate protocol buffers
        run: ./bin/regen-protobufs.sh

      - name: Commit generated protobuf changes
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protobufs
          git add meshtastic/protobuf
          if ! git diff --cached --quiet; then
            PROTOBUF_REVISION="$(git -C protobufs rev-parse HEAD)"
            git commit \
              -m "Regenerate Python protobuf bindings" \
              -m "Refresh the committed runtime modules and type stubs from protobufs ${PROTOBUF_REVISION}." \
              -m "The outputs were produced by bin/regen-protobufs.sh so the Python package remains synchronized with the protocol schema selected by Renovate."
            git push origin "HEAD:${PR_HEAD_REF}"
          else
            echo "No changes to commit"
          fi
