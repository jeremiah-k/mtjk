name: Sync Upstream Master
# Daily: regenerate meshtastic/tests/api_baselines/api_baseline_master.json from
# upstream/master and open a PR against develop whenever the snapshot file
# changes — including provenance-only updates, since the embedded owning SHA
# moves with every upstream commit even when the surface is byte-identical.
# develop is protected (PRs required), so the refreshed snapshot lands
# via an automated PR. The JSON is opt-in test data
# (MESHTASTIC_API_BASELINE_SOURCE=master) and never gates CI.
#
# Note: this job intentionally does NOT mirror upstream/master to a fork-side
# branch. GITHUB_TOKEN cannot push a tree that creates/updates workflow files
# (upstream ships .github/workflows/* we lack) — `workflows` is not a grantable
# GITHUB_TOKEN scope. Local baseline regen reads upstream/master directly via
# the `upstream` remote instead.

on:
  schedule:
    - cron: 0 7 * * *
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UPSTREAM_URL: https://github.com/meshtastic/python.git
  UPSTREAM_REF: master
  BASELINE_FILE: meshtastic/tests/api_baselines/api_baseline_master.json

jobs:
  sync-upstream-master:
    name: Refresh upstream API baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
      - name: Fetch upstream/master and pin SHA
        run: |
          git fetch "${UPSTREAM_URL}" "${UPSTREAM_REF}"
          # Pin the synced commit immediately: later steps use UPSTREAM_SHA,
          # never FETCH_HEAD, so an intervening fetch cannot change the
          # baseline source silently.
          upstream_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          echo "Upstream ${UPSTREAM_URL}@${UPSTREAM_REF} is ${upstream_sha}"
          echo "UPSTREAM_SHA=${upstream_sha}" >> "$GITHUB_ENV"
      - name: Regenerate upstream API baseline snapshot
        run: |
          tmpdir="$(mktemp -d)"
          git archive "${UPSTREAM_SHA}" meshtastic | tar -x -C "${tmpdir}"
          python3 bin/extract_api_surface.py "${tmpdir}/meshtastic" \
            --provenance-ref "upstream/${UPSTREAM_REF}" \
            --provenance-sha "${UPSTREAM_SHA}" \
            > "${BASELINE_FILE}"
          echo "UPSTREAM_SHORT_SHA=$(git rev-parse --short "${UPSTREAM_SHA}")" >> "$GITHUB_ENV"
      - name: Open baseline refresh PR (if snapshot changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${BASELINE_FILE}"
          if git diff --cached --quiet; then
            echo "Baseline snapshot unchanged; nothing to do."
            exit 0
          fi
          git checkout -B bot/upstream-baseline
          git commit -m "Refresh api_baseline_master.json from upstream/master@${UPSTREAM_SHORT_SHA}"
          git push origin bot/upstream-baseline --force
          pr_title="Refresh api_baseline_master.json from upstream/master@${UPSTREAM_SHORT_SHA}"
          pr_body="Automated refresh of the upstream API baseline snapshot (mirror of upstream/master at \`${UPSTREAM_SHORT_SHA}\`). Merges with no checks expected: PRs opened by the workflow token do not trigger CI, and develop requires no approvals."
          open_pr_number="$(gh pr list \
            --base develop \
            --head bot/upstream-baseline \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "${open_pr_number}" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${open_pr_number}" \
              -f title="${pr_title}" \
              -f body="${pr_body}" \
              >/dev/null
            echo "Updated open PR #${open_pr_number} after refreshing the branch."
          else
            gh pr create --base develop --head bot/upstream-baseline \
              --title "${pr_title}" \
              --body "${pr_body}"
          fi
