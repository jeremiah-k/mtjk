name: Sync Upstream Master
# Daily: regenerate meshtastic/tests/api_baselines/api_baseline_master.json from
# upstream/master and open a PR against develop whenever the API surface
# (legacy_import_paths, mesh_interface_methods, node_methods,
# top_level_exports) changes. The embedded provenance block moves with every
# upstream commit even when the surface is byte-identical, so provenance-only
# regenerations are detected and skipped: no commit, no push, no new PR.
# Close an obsolete bot PR if the surface has returned to develop. The
# committed provenance sha therefore goes stale between real surface changes;
# the next real refresh PR carries the accumulated sha jump.
# develop is protected (PRs required), so the refreshed snapshot lands
# via an automated PR. The JSON is opt-in test data
# (MESHTASTIC_API_BASELINE_SOURCE=master) and never gates CI.
#
# Note: this job intentionally does NOT mirror upstream/master to a fork-side
# branch. GITHUB_TOKEN cannot push a tree that creates/updates workflow files
# (upstream ships .github/workflows/* we lack) — `workflows` is not a grantable
# GITHUB_TOKEN scope. Local baseline regen reads upstream/master directly via
# the `upstream` remote instead.

on:
  schedule:
    - cron: 0 7 * * *
  workflow_dispatch: {}

# Manual and scheduled runs share one bot branch. Keep the active run and
# coalesce superseded pending refreshes.
concurrency:
  group: upstream-api-baseline-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UPSTREAM_URL: https://github.com/meshtastic/python.git
  UPSTREAM_REF: master
  BASELINE_FILE: meshtastic/tests/api_baselines/api_baseline_master.json

jobs:
  sync-upstream-master:
    name: Refresh upstream API baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Fetch upstream/master and pin SHA
        run: |
          git fetch "${UPSTREAM_URL}" "${UPSTREAM_REF}"
          # Pin the synced commit immediately: later steps use UPSTREAM_SHA,
          # never FETCH_HEAD, so an intervening fetch cannot change the
          # baseline source silently.
          upstream_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          echo "Upstream ${UPSTREAM_URL}@${UPSTREAM_REF} is ${upstream_sha}"
          echo "UPSTREAM_SHA=${upstream_sha}" >> "$GITHUB_ENV"
      - name: Regenerate upstream API baseline snapshot
        run: |
          tmpdir="$(mktemp -d)"
          git archive "${UPSTREAM_SHA}" meshtastic | tar -x -C "${tmpdir}"
          python3 bin/extract_api_surface.py "${tmpdir}/meshtastic" \
            --provenance-ref "upstream/${UPSTREAM_REF}" \
            --provenance-sha "${UPSTREAM_SHA}" \
            > "${BASELINE_FILE}"
          echo "UPSTREAM_SHORT_SHA=$(git rev-parse --short "${UPSTREAM_SHA}")" >> "$GITHUB_ENV"
      - name: Compare API surface against develop
        id: compare
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys

          baseline = os.environ["BASELINE_FILE"]

          shown = subprocess.run(
              ["git", "show", f"HEAD:{baseline}"],
              capture_output=True,
              text=True,
          )
          if shown.returncode != 0:
              # Baseline file absent from develop: every surface entry is new.
              old = {}
              old_provenance = None
          else:
              old = json.loads(shown.stdout)
              old_provenance = old.pop("provenance", None)

          with open(baseline, encoding="utf-8") as stream:
              new = json.load(stream)
          new_provenance = new.pop("provenance", None)

          changes = []

          def describe(section, old_value, new_value):
              if isinstance(old_value, dict) and isinstance(new_value, dict):
                  for name in sorted(set(new_value) - set(old_value)):
                      changes.append(f"+ {section}.{name}{new_value[name]}")
                  for name in sorted(set(old_value) - set(new_value)):
                      changes.append(f"- {section}.{name}")
                  for name in sorted(set(old_value) & set(new_value)):
                      if old_value[name] != new_value[name]:
                          changes.append(
                              f"~ {section}.{name}: {old_value[name]}"
                              f" -> {new_value[name]}"
                          )
                  return
              old_items = set(old_value)
              new_items = set(new_value)
              for item in sorted(new_items - old_items, key=str):
                  changes.append(f"+ {section}: {item}")
              for item in sorted(old_items - new_items, key=str):
                  changes.append(f"- {section}: {item}")

          for section in sorted(set(new) | set(old)):
              old_value = old.get(section)
              new_value = new.get(section)
              if old_value is None:
                  changes.append(f"+ {section}: added ({len(new_value)} entries)")
              elif new_value is None:
                  changes.append(f"- {section}: removed")
              else:
                  describe(section, old_value, new_value)

          if not changes:
              old_sha = (old_provenance or {}).get("sha", "unknown")
              new_sha = (new_provenance or {}).get("sha", "unknown")
              print(
                  f"API surface unchanged; provenance sha {old_sha} -> {new_sha};"
                  " not opening a PR."
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
                  stream.write("surface_changed=false\n")
              sys.exit(0)

          max_lines = 50
          lines = changes[:max_lines]
          if len(changes) > max_lines:
              lines.append(f"... and {len(changes) - max_lines} more surface changes")
          summary = "\n".join(lines)
          print(summary)
          summary_path = os.path.join(os.environ["RUNNER_TEMP"], "surface-summary.txt")
          with open(summary_path, "w", encoding="utf-8") as stream:
              stream.write(summary + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("surface_changed=true\n")
          PY
      - name: Find existing baseline branch PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Refuse to refresh a same-repository branch used by a human PR.
          pull_requests="$(gh pr list \
            --base develop \
            --head bot/upstream-baseline \
            --state open \
            --json number,isCrossRepository,headRefName,baseRefName,author)"
          jq -r '
            map(select(
              .isCrossRepository == false
              and .headRefName == "bot/upstream-baseline"
              and .baseRefName == "develop"
            ))
            | map(. + {workflow_owned: (
                .author.is_bot == true
                and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]")
              )})
            | "number=\(map(select(.workflow_owned))[0].number // "")",
              "blocked=\(any(.[]; .workflow_owned | not))"
          ' <<< "$pull_requests" >> "$GITHUB_OUTPUT"
      - name: Close obsolete baseline refresh PR
        if: steps.compare.outputs.surface_changed == 'false' && steps.existing-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR_NUMBER: ${{ steps.existing-pr.outputs.number }}
        run: |
          # Compare against the same base that produced the no-change result.
          git fetch --no-tags origin develop
          if ! git diff --quiet HEAD FETCH_HEAD -- "${BASELINE_FILE}"; then
            echo "Develop's committed baseline moved during this run. Keeping the open PR."
            exit 0
          fi
          gh pr close "$OPEN_PR_NUMBER" \
            --comment "The regenerated API surface now matches develop; no refresh is needed."
      - name: Open baseline refresh PR (only when API surface changed)
        if: steps.compare.outputs.surface_changed == 'true' && steps.existing-pr.outputs.blocked == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR_NUMBER: ${{ steps.existing-pr.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${BASELINE_FILE}"
          git checkout -B bot/upstream-baseline
          git commit -m "Refresh api_baseline_master.json from upstream/master@${UPSTREAM_SHORT_SHA}"
          git push --force-with-lease origin bot/upstream-baseline
          pr_title="Refresh api_baseline_master.json from upstream/master@${UPSTREAM_SHORT_SHA}"
          pr_body="Automated refresh of the upstream API baseline snapshot (mirror of upstream/master at \`${UPSTREAM_SHORT_SHA}\`). Merges with no checks expected: PRs opened by the workflow token do not trigger CI, and develop requires no approvals."
          pr_body_file="$(mktemp)"
          {
            printf '%s\n\n## API surface changes\n\n```text\n' "${pr_body}"
            cat "${RUNNER_TEMP}/surface-summary.txt"
            printf '```\n'
          } > "${pr_body_file}"
          open_pr_number="$OPEN_PR_NUMBER"
          if [[ -n "${open_pr_number}" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${open_pr_number}" \
              -f title="${pr_title}" \
              -F body=@"${pr_body_file}" \
              >/dev/null
            echo "Updated open PR #${open_pr_number} after refreshing the branch."
          else
            gh pr create --base develop --head bot/upstream-baseline \
              --title "${pr_title}" \
              --body-file "${pr_body_file}"
          fi
