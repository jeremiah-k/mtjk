name: Build and Upload Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Manual recovery requires a release_tag input; the tag is verified against trusted develop by bin/verify_release_source.py before any build runs.
    inputs:
      release_tag:
        description: Existing release tag whose standalone assets should be rebuilt
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}

jobs:
  build-and-upload-assets:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.target_commitish != 'master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Refresh trusted develop and release tags
        run: |
          git fetch --force --tags origin '+refs/heads/develop:refs/remotes/origin/develop'
          git checkout --detach refs/remotes/origin/develop

      - name: Verify release source and package metadata
        id: release_source
        run: >-
          python bin/verify_release_source.py
          --tag "${RELEASE_TAG}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Verify manual recovery release exists
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null

      - name: Stage trusted standalone release tooling
        run: |
          install -m 0755 bin/build-bin.sh "${RUNNER_TEMP}/build-bin.sh"
          install -m 0755 bin/smoke-standalone.sh "${RUNNER_TEMP}/smoke-standalone.sh"

      - name: Checkout validated release commit
        env:
          RELEASE_COMMIT: ${{ steps.release_source.outputs.commit }}
        run: git checkout --detach "${RELEASE_COMMIT}"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.24
          # This privileged release job is infrequent; avoid restoring a mutable
          # dependency cache across release builds.
          enable-cache: false

      - name: Build standalone assets
        id: cli_branding
        run: "${RUNNER_TEMP}/build-bin.sh"

      - name: Smoke-test standalone executables
        env:
          PRIMARY_CLI_NAME: ${{ steps.cli_branding.outputs.primary }}
          COMPATIBILITY_CLI_NAMES: ${{ steps.cli_branding.outputs.compatibility }}
          RELEASE_VERSION: ${{ steps.release_source.outputs.version }}
        run: |
          "${RUNNER_TEMP}/smoke-standalone.sh" "dist/${PRIMARY_CLI_NAME}" "${RELEASE_VERSION}" "${PRIMARY_CLI_NAME}"
          read -r -a compatibility_clis <<< "${COMPATIBILITY_CLI_NAMES}"
          for cli_name in "${compatibility_clis[@]}"; do
            [[ -n ${cli_name} ]] || continue
            "${RUNNER_TEMP}/smoke-standalone.sh" "dist/${cli_name}" "${RELEASE_VERSION}" "${PRIMARY_CLI_NAME}"
          done

      - name: Prepare release asset names
        env:
          PRIMARY_CLI_NAME: ${{ steps.cli_branding.outputs.primary }}
          COMPATIBILITY_CLI_NAMES: ${{ steps.cli_branding.outputs.compatibility }}
        run: |
          test -f standalone_readme.txt || { echo "::error::Missing standalone_readme.txt artifact."; exit 1; }
          rm -rf release-assets
          mkdir release-assets
          read -r -a compatibility_clis <<< "${COMPATIBILITY_CLI_NAMES}"
          cli_names=("${PRIMARY_CLI_NAME}" "${compatibility_clis[@]}")
          for cli_name in "${cli_names[@]}"; do
            [[ -n ${cli_name} ]] || continue
            test -f "dist/${cli_name}" || { echo "::error::Missing dist/${cli_name} build artifact."; exit 1; }
            cp "dist/${cli_name}" "release-assets/${cli_name}_ubuntu"
          done
          cp standalone_readme.txt release-assets/readme.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-release-assets-${{ steps.release_source.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release_source.outputs.tag }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
