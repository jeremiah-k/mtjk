# Includes PEP 561 py.typed marker for type checker support.
[project]
# Keep this static install-time identity synchronized with meshtastic/_branding.py.
name = "mtjk"
version = "2.7.11.post8"
description = "Python API & client shell for talking to Meshtastic devices"
authors = [{ name = "Meshtastic Developers (upstream project authors)" }]
maintainers = [{ name = "Jeremiah K.", email = "jeremiahk@gmx.com" }]
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
# Keep pypubsub >=4.0.7 for its PEP 561 typing metadata.
dependencies = [
  "pyserial>=3.5,<4.0",
  "protobuf>=5.29.5",
  "typing-extensions>=4.15.0; python_version < \"3.13\"",
  "tabulate>=0.10.0,<0.11.0",
  "requests>=2.33.0,<3.0.0",
  "pyyaml>=6.0.1,<7.0.0",
  "pypubsub>=4.0.7,<5.0.0",
  "bleak>=3.0.1,<4.0.0",
  "packaging>=26.0,<27.0",
  "argcomplete>=3.5.2,<4.0.0",
  "segno>=1.6.6,<2.0.0",
  "print-color>=0.4.6,<0.5.0",
  "wcwidth>=0.9.0,<0.10.0",
]

[project.urls]
Homepage = "https://github.com/jeremiah-k/mtjk"
Repository = "https://github.com/jeremiah-k/mtjk"

[project.optional-dependencies]
# CLI niceties are core dependencies; retain the historical no-op cli extra.
cli = []
# slog imports these at module load; the core client does not import slog.
analysis = [
  "dash>=4.0.0,<5.0.0",
  "dash-bootstrap-components>=2.0.4,<3.0.0",
  "parse>=1.20.2,<2.0.0",
  "platformdirs>=4.2.2,<5.0.0",
  "plotly>=7.0.0,<8.0.0",
  "pandas>=2.2.2,<3.0.0",
  "pandas-stubs>=2.3.3.260113,<3.0.0.0",
  "pyarrow>=25.0.0,<26.0.0",
]

[project.scripts]
# Primary/compatibility CLI keys are enforced by test_branding.py.
mtjk = "meshtastic.__main__:main"
meshtastic = "meshtastic.__main__:main"
# The tunnel uses the in-tree LinuxTunDevice adapter (stdlib only).
mesh-tunnel = "meshtastic.__main__:tunnelMain"
mesh-analysis = "meshtastic.analysis.__main__:main [analysis]"

[dependency-groups]
dev = [
  "hypothesis==6.168.3",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-timeout==2.5.0",
  "pdoc==16.0.0",
  "pylint==4.1.2",
  "pyinstaller==6.22.3",
  "mypy==2.4.0",
  "mypy-protobuf==5.1.0",
  "types-protobuf>=7.35.1.20260906,<7.36.0.0",
  "types-tabulate>=0.10.0.20260508,<0.11.0.0",
  "types-requests>=2.32.4.20260107,<3.0.0.0",
  "types-setuptools>=84.0.0.20260812,<84.1.0.0",
  "types-pyyaml>=6.0.12.20250915,<7.0.0.0",
  "pyarrow-stubs>=20.0.0.20251215,<21.0.0.0",
]
# Shared analysis/powermon constraints are enforced by test_branding.py.
powermon = [
  "riden",
  "ppk2-api>=0.9.2,<0.10.0",
  "parse>=1.20.2,<2.0.0",
  "pyarrow>=25.0.0,<26.0.0",
  "platformdirs>=4.2.2,<5.0.0",
]
analysis = [
  "jupyterlab>=4.2.2,<5.0.0",
  "matplotlib>=3.9.0,<4.0.0",
  "ipympl>=0.10.0,<0.11.0",
  "ipywidgets>=8.1.3,<9.0.0",
  "jupyterlab-widgets>=3.0.11,<4.0.0",
]

[tool.uv]
required-version = ">=0.12.22"
default-groups = ["dev"]

[tool.uv.sources]
# Immutable source pin; see DEPENDENCY_POLICY.md before changing it.
riden = { git = "https://github.com/geeksville/riden.git", rev = "27fd58f069a089676dcaaea2ccb8dc8d24e4c6d9" }

[tool.uv.build-backend]
module-name = "meshtastic"
module-root = ""
# Keep local test outputs out of wheels and source distributions.
source-exclude = [
  "**/.coverage*",
  "**/.pytest_cache/**",
  "**/.mypy_cache/**",
  "**/.hypothesis/**",
  "meshtastic/tests/api_baselines/*_test.json",
]

# Optional: pipx install poethepoet, then run poe code inside the project environment.
[tool.poe.tasks]
code = "code ."
jupyter = "uv run --locked --extra analysis --group analysis jupyter lab"

[tool.isort]
# Keep bare isort aligned with Black to avoid conflicting formatter output.
profile = "black"

[build-system]
requires = ["uv_build==0.12.22"]
build-backend = "uv_build"
