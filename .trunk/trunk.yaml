version: 0.1
cli:
  version: 1.25.0
  options:
    # Keep trunk check non-interactive by default so fixes are always explicit.
    - commands:
        - check
      args: -n
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
repo:
  # The fork's primary branch is develop (never main/master), so trunk
  # check must diff against it explicitly; auto-detection fails here and
  # would never consult the `upstream` remote reserved for the sync
  # workflow.
  trunk_branch: develop
lint:
  disabled:
    - bandit
    - oxipng
    - pylint
    - renovate
    # actionlint and pinact both have broken --fix paths that mangle pinned
    # GitHub Actions `uses:` references (concatenating the resolved version tag
    # onto the existing line and duplicating the `uses:` key, producing invalid
    # YAML). Disable both until upstream fixes the autofix; CI relies on the
    # SHA-pinned references renovate/pinact-manual already maintain.
    - actionlint
    - pinact
  ignore:
    - linters: [ALL]
      paths:
        # Ignore generated files
        - meshtastic/**/*_pb2.py
        - meshtastic/**/*_pb2.pyi
        - meshtastic/tests/api_baselines/*.json
        # Ignore external protobufs submodule content in this repo's lint scope.
        - protobufs/**
        # Keep project license text untouched by automated lint/format tools.
        - LICENSE.md
        # Codacy managed config — do not lint/format its generated files.
        - .codacy/**
    - linters: [checkov]
      paths:
        # Test device config with non-secret MQTT credentials for local testing.
        - test_config.yaml
    - linters: [mypy-poetry]
      paths:
        # Keep Trunk's mypy scope aligned with CI (meshtastic/ only).
        - bin/**
        - examples/**
        - tests/**
    - linters: [pylint-poetry]
      paths:
        # Keep Trunk's pylint scope aligned with CI (meshtastic/ + examples/).
        - bin/**
        - tests/**
        - meshtastic/tests/**
  definitions:
    - name: mypy-poetry
      description: Run mypy via Poetry using the project's pinned dependencies.
      files: [python, python-interface]
      suggest_if: files_present
      direct_configs:
        - pyproject.toml
        - poetry.lock
      commands:
        - name: lint
          output: mypy
          run: poetry -C ${workspace} run mypy meshtastic/
          target: meshtastic
          run_from: ${root_or_parent_with_any_config}
          disable_upstream: true
          success_codes: [0]
          batch: true
          stdin: false
    - name: pylint-poetry
      description: Run pylint via Poetry with the project's pinned dependencies.
      files: [python]
      suggest_if: files_present
      direct_configs:
        - pyproject.toml
        - poetry.lock
        - .pylintrc
      commands:
        - name: lint
          output: pylint
          run: poetry -C ${workspace} run pylint --exit-zero --output ${tmpfile} --output-format json ${target}
          read_output_from: tmp_file
          run_from: ${root_or_parent_with_any_config}
          disable_upstream: true
          success_codes: [0]
          batch: true
          cache_results: true
          stdin: false
  enabled:
    - grype@0.117.0
    - black@26.5.1
    - checkov@3.3.19
    - git-diff-check
    - gitleaks@8.30.1
    - isort@9.0.1
    - markdownlint@0.49.1
    - osv-scanner@2.5.1
    - prettier@3.9.7
    - ruff@0.16.8
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - taplo@0.10.0
    - trivy@0.74.0
    - trufflehog@3.97.1
    - yamllint@1.38.0
    - mypy-poetry
    - pylint-poetry
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
